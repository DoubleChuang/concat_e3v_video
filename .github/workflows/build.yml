name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: linux-x86_64 (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: python:3.11-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install curl, tar, binutils and GUI/XCB dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl xz-utils binutils \
            libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Check tag matches app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c 'import app.version as v; print(v.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 與 app/version.py 的 v${version} 不一致"
            exit 1
          fi

      - name: Build (bundles static ffmpeg)
        run: ./build/build_linux.sh
        env:
          PYTHON: python

      # 這個容器沒有任何系統 CA，正是使用者端會遇到的條件。
      # 若 certifi 沒被包進去，這裡就會 CERTIFICATE_VERIFY_FAILED 而失敗。
      - name: Smoke test updater TLS inside the bundle
        run: ./dist/concat-e3v --check-updates

      - name: Rename artifact
        run: mv dist/concat-e3v dist/concat-e3v-linux-x86_64

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: concat-e3v-linux-x86_64
          path: dist/concat-e3v-linux-x86_64

  build-macos-x86_64:
    name: macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Build (bundles static ffmpeg)
        run: ./build/build_mac.sh
        env:
          PYTHON: python

      - name: Ad-hoc sign (required to run on Apple Silicon)
        run: codesign --force --deep -s - dist/concat-e3v.app

      - name: Package as zip
        run: ditto -c -k --keepParent dist/concat-e3v.app dist/concat-e3v-macos-x86_64.app.zip

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: concat-e3v-macos-x86_64
          path: dist/concat-e3v-macos-x86_64.app.zip

  build-macos-arm64:
    name: macos-arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Build (bundles static ffmpeg)
        run: ./build/build_mac.sh
        env:
          PYTHON: python

      - name: Ad-hoc sign (required to run on Apple Silicon)
        run: codesign --force --deep -s - dist/concat-e3v.app

      - name: Package as zip
        run: ditto -c -k --keepParent dist/concat-e3v.app dist/concat-e3v-macos-arm64.app.zip

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: concat-e3v-macos-arm64
          path: dist/concat-e3v-macos-arm64.app.zip

  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Build (bundles static ffmpeg)
        run: build\build_windows.bat
        shell: cmd

      - name: Rename artifact
        run: move dist\concat-e3v.exe dist\concat-e3v-windows.exe
        shell: cmd

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: concat-e3v-windows
          path: dist/concat-e3v-windows.exe

  release:
    name: Release
    needs: [build-linux, build-macos-x86_64, build-macos-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
